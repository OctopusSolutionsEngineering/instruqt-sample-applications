name: Octopus Ephemeral Environments Demo PR Closed
permissions:
  contents: write
  packages: write
on:
  workflow_dispatch:
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - closed
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0    
      - name: Deprovision Ephemeral Environment
        id: deprovision_ephemeral_environment
        uses: OctopusDeploy/deprovision-ephemeral-environment@v1.0.0
        with:
          server: ${{ secrets.LOCAL_OCTOPUS_SERVER_URL }}
          api_key: ${{ secrets.LOCAL_OCTOPUS_API_KEY }}
          name: 'ephemeral-environment-pr-${{ github.event.pull_request.number }}'
          project: '${{ vars.PROJECT_NAME}}'
          space: '${{ vars.SPACE_NAME}}'
      - name: Configure Git user
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
      